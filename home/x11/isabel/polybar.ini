;; Polybar темы Isabel (gh0stzk, бар bar09), переделано под NixOS.
;; Цвета — блок [color]. Модули — блоки [module/...] ниже.
;; Какие модули показывать — строки modules-left / modules-center / modules-right.

[color]
bg = #14171c
bg-alt = #0014171c
fg = #abb2bf
pill = #181b21
trans = #0014171c
black = #181b21
red = #be5046
green = #81ae5f
yellow = #d19a66
blue = #4889be
magenta = #7560d3
cyan = #49919a
white = #abb2bf
black-bright = #5c6370
red-bright = #e06c75
green-bright = #98c379
yellow-bright = #e5c07b
blue-bright = #61afef
magenta-bright = #8677cf
cyan-bright = #56b6c2
white-bright = #b8bfe5
purple = #c678dd
pink = #d17a9a
lime = #9fca56
amber = #dcae66
orange = #c1774a
grey = #6b7280
indigo = #5f6fbd
blue-gray = #5a6b87

[global/wm]

margin-bottom = 0
margin-top = 0


[bar/isa-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 100%
height = 40

offset-x = 0
offset-y = 0

background = ${color.bg}
foreground = ${color.fg}

radius = 0

line-size = 2
line-color = ${color.blue}

border-size = 0
border-color = ${color.bg}

padding-left = 2
padding-right = 2

module-margin-left = 0
module-margin-right = 0

font-0 = "Inconsolata Semi Condensed Bold:size=11;2"
font-1 = "Material Design Icons Desktop:size=16;4"
font-2 = "Material Design Icons Desktop:size=12;3"
font-3 = "Font Awesome 6 Free Solid:size=10;3"

modules-left = launcher sep2 bspwm sep2 music sep colorpicker
modules-center = title
modules-right = bluetooth sep xkeyboard sep filesystem sep cpu_bar sep memory_bar sep pulseaudio sep network sep2 tray sep date sep power

separator =
dim-value = 1.0

wm-restack = bspwm
enable-struts = true
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false

;; ─── Модули ───

[module/date]
type = internal/date

interval = 1.0

time = %H:%M
format-foreground = ${color.fg}
date-alt = "%a, %d %b %Y"

format = <label>
format-prefix-foreground = ${color.blue}

label = "%time%%date%"

[module/filesystem]
type = internal/fs

mount-0 = /

interval = 60
fixed-values = true

format-mounted = <label-mounted>
format-mounted-prefix = " "

format-unmounted = <label-unmounted>
format-unmounted-prefix = " "

label-mounted = "%used% "
label-mounted-foreground = ${color.grey}
label-unmounted = %mountpoint%: not mounted

[module/network]
type = internal/network
interface-type = wired

interval = 3.0
accumulate-stats = true
unknown-as-up = true
speed-unit = ""

format-connected = <label-connected>
format-connected-prefix = "  "
label-connected = "%netspeed%"
label-connected-foreground = ${color.grey}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "  "
label-disconnected = "Offline"
label-disconnected-foreground = ${color.red}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume><label-volume>
format-volume-prefix = ""

label-volume = " %percentage%"
label-volume-foreground = ${color.grey}

format-muted = <label-muted>
format-muted-prefix = " "
label-muted = "Muted"
label-muted-foreground = ${color.red}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-4 = 

click-right = pavucontrol &

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false


format = <label-state>
format-font = 3

label-focused = 󰮯
label-focused-padding = 1
label-focused-foreground = ${color.fg}
label-focused-font = 3

label-occupied = 󰊠
label-occupied-padding = 1
label-occupied-foreground= ${color.fg}
label-occupied-font = 3

label-urgent = 󰊠
label-urgent-padding = 1
label-urgent-foreground= ${color.fg}
label-urgent-font = 3

label-empty = 󰑊
label-empty-padding = 1
label-empty-foreground = ${color.grey}
label-empty-font = 3

[module/title]
type = internal/xwindow

format = <label>
format-prefix = "󱂬 "
format-prefix-font = 3
format-prefix-foreground = ${color.magenta}

label = %title%
label-maxlen = 35

label-empty = "NixOS"
label-empty-foreground = ${color.grey}

[module/launcher]
type = custom/text
label = 󱄅
label-font = 2
label-foreground = ${color.fg}

click-left = RofiLauncher
click-right = RofiLauncher --choose-style

[module/sep]
type = custom/text
label = " "
label-foreground = ${color.bg}

[module/sep2]
type = custom/text
label = " 󰇙 "
label-foreground = ${color.indigo}

[module/cpu_bar]
type = internal/cpu

interval = 0.5
;; agregar <bar-load> o <ramp-load> antes de label para agregar barrita chida
format = <label>
format-prefix = " "

label = "%percentage%% "
label-foreground = ${color.grey}

[module/memory_bar]
type = internal/memory

interval = 3

;; agregar <bar-used> antes de label para agregar barrita chida
format = <label>
format-prefix = " "

label = "%used% "
label-foreground = ${color.grey}

[module/power]
type = custom/text
label = " "
label-foreground = ${color.red}

click-left = PowerMenu

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 7px
tray-padding = 0px
tray-size = 40%

[module/bluetooth]
type = custom/script
exec = bluetooth-polybar.sh
interval = 3

format = <label>
format-font = 3
label = "%output%"
click-left = rofi-bluetooth

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = " "
format-prefix-font = 2

label-layout = "%layout% "
label-layout-foreground = ${color.grey}

[module/colorpicker]
type = custom/text
label = ""
click-left = Colorpicker

[module/music]
type = custom/script
exec = playerctl --follow metadata --format '{{ trunc(artist, 18) }} - {{ trunc(title, 25) }}' 2>/dev/null
tail = true
format = <label>
format-prefix = "󰝚 "
format-prefix-foreground = ${color.green}
label = "%output%"
label-foreground = ${color.grey}
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous
