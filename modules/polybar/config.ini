[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ~/.local/state/bspwm/system.ini
include-file = modules.ini

; Colors generated by Matugen; provenance and license: SOURCE and LICENSE.
include-file = ~/.local/state/bspwm/polybar-colors.ini

[bar/varinka-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = false

width = 96%
height = 35

offset-x = 2%
offset-y = 3

background = ${color.bg}
foreground = ${color.fg}

radius = 8

line-size = 2
line-color = ${color.blue}

border-size = 2
border-color = ${color.bg-alt}

padding-left = 2
padding-right = 2

module-margin-left = 0
module-margin-right = 0

dpi = 96
font-0 = "Maple Mono NF:style=Bold Italic:size=9;2"
font-1 = "Symbols Nerd Font Mono:size=11;2"
font-2 = "Symbols Nerd Font Mono:size=20;4"
font-3 = "Symbols Nerd Font Mono:size=8;2"

;Modules availables but not active: 
;	brightness		weather
modules-left = launcher sep sep bspwm sep sep2 sep title
modules-center =
modules-right = spl mplayer sep usercard spr mpd_control sep sep2 bluetooth sep battery sep updates sep filesystem sep cpu_bar sep memory_bar sep pulseaudio sep network sep2 tray sep date sep power

separator = 
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll = 

[settings]

screenchange-reload = false

compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
