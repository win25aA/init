[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ~/.local/state/bspwm/system.ini
include-file = modules.ini

; Palette generated by Matugen; original source and adaptations: SOURCE.
include-file = ~/.local/state/bspwm/silvia-colors.ini

[bar/cata-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = false

width = 100%
height = 45

offset-x = 0
offset-y = 0

background = ${color.bg}
foreground = ${color.fg}

radius = 0

line-size = 3
line-color = ${color.blue}

border-size = 0
border-color = ${color.bg}

padding-left = 2
padding-right = 0

module-margin-left = 0
module-margin-right = 0

dpi = 96
font-0 = "JetBrains Mono:style=Bold:size=9;1"
font-1 = "Symbols Nerd Font Mono:size=11;2"
font-2 = "Font Awesome 7 Free:style=Solid:size=9;1"
font-3 = "Symbols Nerd Font Mono:size=18;3"

modules-left = launcher sep2 bspwm sep2 title
modules-center = 
modules-right = mplayer power sep2 bluetooth sep battery sep updates sep filesystem sep cpu_bar sep memory_bar sep pulseaudio sep date sep tray sep

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll = 

[settings]

screenchange-reload = false

compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
