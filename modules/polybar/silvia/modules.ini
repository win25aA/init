[module/date]
type = internal/date

interval = 1.0

time = %I:%M %P
;date-alt = " %A, %d %B %Y"

format = <label>
format-prefix = 
format-prefix-padding-right = 5px
format-prefix-font = 3
label = "%{A1:desktop-menu calendar:}%time%%{A}"
format-underline = ${color.indigo}

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /
interval = 60
fixed-values = false

format-mounted = <label-mounted>
format-mounted-prefix = 
format-mounted-prefix-font = 3
format-mounted-prefix-padding-right = 5px
format-mounted-underline = ${color.red}

format-unmounted = <label-unmounted>
format-unmounted-prefix = 
format-unmounted-prefix-font = 3
format-unmounted-prefix-padding-right = 5px
format-unmounted-underline = ${color.red}

label-mounted = %used%
label-unmounted = %mountpoint%: not mounted

######################################################

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <label-volume>
format-volume-prefix = 
format-volume-prefix-font = 3
format-volume-prefix-padding-right = 5px
format-volume-underline = ${color.blue}
label-volume = %percentage%

format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-font = 3
format-muted-prefix-padding-right = 5px
format-muted-underline = ${color.blue}
label-muted = Muted
label-muted-foreground = ${color.red}

click-right = pavucontrol

######################################################

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = false

format = <ramp><label>
format-underline = ${color.yellow}
label = %percentage%%

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-font = 3
ramp-padding-right = 5px

######################################################

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = <animation-charging><label-charging>
format-charging-underline = ${color.indigo}
label-charging = %percentage%%

format-discharging = <ramp-capacity><label-discharging>
format-discharging-underline = ${color.indigo}
label-discharging = %percentage%%

format-full = <label-full>
format-full-underline = ${color.indigo}
format-full-prefix = 
format-full-prefix-font = 3
format-full-prefix-padding-right = 5px
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 3
ramp-capacity-padding-right = 5px

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-font = 3
animation-charging-padding-right = 5px
animation-charging-framerate = 700

######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false


format = <label-state>
format-font = 2

label-focused = 󰺕
label-focused-padding = 1
label-focused-foreground = ${color.lime}

label-occupied = 󰀚
label-occupied-padding = 1
label-urgent = %icon%
label-urgent-padding = 0

label-empty = 󰑊
label-empty-foreground = ${color.grey}
label-empty-padding = 1

######################################################

[module/title]
type = internal/xwindow

format = <label>
format-prefix = 󱂬
format-prefix-font = 2
format-prefix-padding-right = 5px
format-prefix-foreground = ${color.pink}

label = %title%
label-maxlen = ${env:VARINKA_TITLE_LENGTH:24}
label-ellipsis = true

label-empty = NixOS
label-empty-foreground = ${color.grey}

######################################################

[module/updates]
type = custom/script
exec = bspwm-updates status
interval = 120

format = <label>
format-prefix = 
format-prefix-padding-right = 5px
format-prefix-font = 3
format-underline = ${color.green}
label = %output%

click-left = bspwm-updates check
click-right = bspwm-updates info

######################################################

[module/launcher]
type = custom/text

label = 󰣇
label-font = 4
label-foreground = ${color.fg}

click-left = desktop-menu launcher
click-right = polybar-theme

######################################################

[module/sep]
type = custom/text
label = " "
label-padding = 3pt
label-foreground = ${color.bg-alt}

######################################################

[module/sep2]
type = custom/text
label = " 󰇙 "
label-font = 2
label-foreground = ${color.indigo}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-prefix = 
format-prefix-padding-right = 5px
format-prefix-font = 3
label = %percentage%%
format-underline = ${color.cyan}

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label>
format-prefix = 
format-prefix-padding-right = 5px
format-prefix-font = 3
format-underline = ${color.purple}

label = %used%

######################################################

[module/mplayer]
type = custom/text
label = 
label-font = 3
label-padding-right = 1
label-foreground = ${color.green}

click-left = spotify
click-right = xdg-open ~/Music

[module/power]
type = custom/text
label = 
label-font = 3
label-padding = 4px
label-foreground = ${color.red}

click-left = desktop-menu session

######################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg}
tray-background = ${color.bg}
tray-foreground = ${color.fg}
tray-spacing = 5px
tray-padding = 0px
tray-size = 38%

#####################################################

[module/bluetooth]
type = custom/script
exec = bspwm-bluetooth-status
interval = 3

format = <label>
format-font = 2
format-underline = ${color.blue}
label = "%output%"
click-left = blueman-manager
