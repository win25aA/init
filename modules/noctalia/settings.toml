[osd.kinds]
media = false

[plugin_settings."noctalia/screen_recorder"]
audio_source = "both"

[plugin_settings."noctalia/wallhaven"]
download_dir = "/etc/nixos/wallpapers/"

[plugin_settings."whyoolw/dropwall"]
copy_to_wallpaper_dir = true

[plugins]
enabled = [ "radimous/prismlauncher-instances", "noctalia/wallhaven" ]

[shell]
avatar_path = "/etc/nixos/wallpapers/.face"
lang = "ru"

    [shell.screen_corners]
    size = 30

[theme]
community_palette = "Cyberpunk"
source = "wallpaper"

    [theme.templates]
    builtin_ids = []
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/etc/nixos/wallpapers"

    [wallpaper.default]
    path = "/etc/nixos/wallpapers/wallhaven-1qdjv1.jpg"

    [wallpaper.last]
    path = "/etc/nixos/wallpapers/wallhaven-1qdjv1.jpg"

    [wallpaper.monitors.DVI-D-1]
    path = "/etc/nixos/wallpapers/wallhaven-1qdjv1.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/etc/nixos/wallpapers/wallhaven-1qdjv1.jpg"

[widget.audio_visualizer]
enabled = false

[widget.control-center]
capsule = true
custom_image_colorize = true

[widget.cpu]
display = "text"

[widget.ram]
display = "text"

[widget.tray]
color = "primary"