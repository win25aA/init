config_version = 14

[bar.default]
center = [ "group:g2" ]
end = [ "group:g1", "tray", "volume", "group:g3" ]
font_weight = 700
start = [ "workspaces", "clock" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "media", "audio_visualizer" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = false
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "control-center", "session" ]
    opacity = 1.0
    padding = 6.0

[control_center]
hidden_tabs = [ "monitor", "power", "network" ]

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "clipboard"

    [[control_center.shortcuts]]
    type = "notification"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 160.0
    box_width = 256.0
    cx = 144.0
    cy = 118.0
    output = "DVI-D-1"
    placement_height = 900.0
    placement_width = 1440.0
    rotation = -0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        shadow = false

[location]
address = "vysokaya gora tatarstan"
latitude = 55.912199999999999
longitude = 49.312800000000003

