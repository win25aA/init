; Native rounded window. No Powerline caps or per-label background fragments.
include-file = @CACHE@/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%:-32
offset-x = 16
offset-y = 12
height = 44
radius = 18
background = ${colors.surface_container}
foreground = ${colors.on_surface}
font-0 = DejaVu Sans:style=Book:size=10;3
font-1 = Symbols Nerd Font Mono:size=12;3
padding-left = 2
padding-right = 2
module-margin = 1
modules-left = launcher workspaces separator clock
modules-center = media
modules-right = tray pulseaudio notifications separator control session
wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

[bar/secondary]
inherit = bar/main
modules-right = pulseaudio notifications separator control session

[module/launcher]
type = custom/text
format = 
format-font = 2
format-foreground = ${colors.primary}
click-left = rofi -show drun

[module/workspaces]
type = custom/script
exec = bspwm-desktop workspaces
tail = true
format = <label>
label = %output%

[module/separator]
type = custom/text
format = │
format-foreground = ${colors.outline_variant}

[module/clock]
type = internal/date
interval = 1
time = %H:%M
date-alt = %d.%m.%Y
label = %time% %date%

[module/media]
type = custom/script
exec = bspwm-desktop media
interval = 2
format = <label>
label = %output%
format-foreground = ${colors.on_surface_variant}
click-left = playerctl play-pause
click-right = bspwm-desktop media-menu
scroll-up = playerctl next
scroll-down = playerctl previous

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟
label-muted-foreground = ${colors.outline}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-right = pavucontrol

[module/tray]
type = internal/tray
tray-size = 18
tray-spacing = 8

[module/notifications]
type = custom/script
exec = bspwm-desktop notify-count
interval = 2
click-left = bspwm-desktop notifications
click-right = dunstctl set-paused toggle

[module/control]
type = custom/text
format = 󰒓
format-font = 2
click-left = bspwm-desktop control
click-right = copyq show

[module/session]
type = custom/text
format = 󰐥
format-font = 2
click-left = bspwm-desktop session
click-right = bspwm-desktop lock
